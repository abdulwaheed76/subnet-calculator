name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  APP_NAME: subnet-calculator
  DEPLOY: ${{ github.event_name == 'push' && vars.AWS_ROLE_ARN != '' }}

jobs:
  # ===================== JOB 1: TEST =====================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # ===================== JOB 2: BUILD, SCAN, PUSH =====================
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub log in to AWS with OIDC, so no AWS keys are stored
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t app:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true # only fail on issues that have a fix available
          exit-code: '1'

      # The image pushed below is the exact one that was scanned above, not a rebuild.
      - name: Log in to AWS
        if: env.DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: env.DEPLOY == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Push image (tagged with commit SHA)
        if: env.DEPLOY == 'true'
        run: |
          # LEARN: Full image address, e.g. 983388732711.dkr.ecr.eu-west-1.amazonaws.com/subnet-calculator:<sha>
          IMAGE=${{ steps.ecr.outputs.registry }}/$APP_NAME:$GITHUB_SHA
          # LEARN: Give the local image its ECR name, then upload it.
          docker tag app:$GITHUB_SHA "$IMAGE"
          docker push "$IMAGE"

  # ===================== JOB 3: DEPLOY TO ECS =====================
  deploy:
    needs: build

    if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: production # never run two deploys at the same time
    permissions:
      id-token: write
    steps:
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Work out the image address
        id: image
        run: echo "uri=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com/$APP_NAME:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Put the new image into the latest task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: ${{ env.APP_NAME }}
          container-name: app
          image: ${{ steps.image.outputs.uri }}
          environment-variables: APP_VERSION=${{ github.sha }}

      # ECS starts the new tasks, waits for them to pass the load balancer health check, then stops the old ones.
      - name: Deploy to ECS and wait until the service is stable
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.APP_NAME }}
          service: ${{ env.APP_NAME }}
          # LEARN: Don't finish this step until ECS reports the rollout is done (or failed).
          wait-for-service-stability: true

      # Also catches an automatic rollback: the service is "stable" again, but on the old version.
      - name: Check the new version is live
        env:
          # The load balancer URL from Terraform's output, stored as a repo variable.
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # 4 requests per try so the load balancer sends them to different tasks.
          all_new() { for _ in 1 2 3 4; do curl -fsS "$APP_URL/health" | grep -q "$GITHUB_SHA" || return 1; done; }
          for _ in $(seq 30); do
            all_new && { echo "Version $GITHUB_SHA is live at $APP_URL"; exit 0; }
            sleep 5
          done
          echo "New version not live after 150s"; exit 1
